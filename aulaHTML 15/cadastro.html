<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Perfil</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body class="py-4">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card card-form p-4">
          <div class="logo text-white mx-auto mb-3">👤</div>
          <h1 class="h3 text-center fw-bold">Cadastro de Perfil</h1>
          <p class="text-center text-secondary mb-4">Preencha seus dados para criar a conta</p>

          <form id="formCadastro" novalidate>

           
            <div class="mb-3">
              <label for="nome" class="form-label fw-semibold">Nome completo</label>
              <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome">
              <div class="invalid-feedback d-block" id="erroNome"></div>
            </div>

            <div class="mb-3">
              <label for="emailCad" class="form-label fw-semibold">E-mail</label>
              <input type="email" class="form-control" id="emailCad" name="email" placeholder="voce@exemplo.com">
              <div class="invalid-feedback d-block" id="erroEmailCad"></div>
            </div>

            <div class="mb-3">
              <label for="senhaCad" class="form-label fw-semibold">Senha (mín. 8, com letra e número)</label>
              <input type="password" class="form-control" id="senhaCad" name="senha" placeholder="Crie uma senha">
              <div class="progress mt-2" style="height: 6px;">
                <div class="progress-bar" id="forcaBarra" style="width: 0%"></div>
              </div>
              <div class="form-text" id="forcaTexto"></div>
              <div class="invalid-feedback d-block" id="erroSenhaCad"></div>
            </div>

            <div class="mb-3">
              <label for="confirmaSenha" class="form-label fw-semibold">Confirmar senha</label>
              <input type="password" class="form-control" id="confirmaSenha" name="confirmaSenha" placeholder="Repita a senha">
              <div class="invalid-feedback d-block" id="erroConfirma"></div>
            </div>

   
            <fieldset class="mb-3">
              <legend class="form-label fs-6 fw-semibold">Gênero</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="genero" id="generoF" value="feminino">
                <label class="form-check-label" for="generoF">Feminino</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="genero" id="generoM" value="masculino">
                <label class="form-check-label" for="generoM">Masculino</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="genero" id="generoO" value="outro">
                <label class="form-check-label" for="generoO">Outro</label>
              </div>
              <div class="invalid-feedback d-block" id="erroGenero"></div>
            </fieldset>


            <div class="mb-3">
              <label for="curso" class="form-label fw-semibold">Curso</label>
              <select class="form-select" id="curso" name="curso">
                <option value="">Selecione...</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
              </select>
              <div class="invalid-feedback d-block" id="erroCurso"></div>
            </div>

   
            <fieldset class="mb-3">
              <legend class="form-label fs-6 fw-semibold">Interesses (escolha ao menos 1)</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="interesses" id="intFront" value="front">
                <label class="form-check-label" for="intFront">Front-end</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="interesses" id="intBack" value="back">
                <label class="form-check-label" for="intBack">Back-end</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="interesses" id="intDesign" value="design">
                <label class="form-check-label" for="intDesign">Design</label>
              </div>
              <div class="invalid-feedback d-block" id="erroInteresses"></div>
            </fieldset>


            <div class="mb-3">
              <label for="bio" class="form-label fw-semibold">Sobre você</label>
              <textarea class="form-control" id="bio" name="bio" rows="4" maxlength="200"
                        placeholder="Fale um pouco sobre você (mín. 10 caracteres)"></textarea>
              <div class="form-text text-end" id="contador">0/200</div>
              <div class="invalid-feedback d-block" id="erroBio"></div>
            </div>


            <div class="form-check mb-1">
              <input class="form-check-input" type="checkbox" id="termos" name="termos">
              <label class="form-check-label" for="termos">Aceito os termos de uso</label>
            </div>
            <div class="invalid-feedback d-block mb-3" id="erroTermos"></div>

            <button type="submit" class="btn btn-principal w-100 py-2 fw-semibold">Cadastrar</button>
            <p id="msgCadastro" class="mt-3"></p>
          </form>


          <div class="alert alert-light border mt-3 small mb-0">
            <div class="fw-semibold mb-1">Resumo em tempo real</div>
            <div id="resumo"><strong>Nome:</strong> -<br><strong>E-mail:</strong> -<br><strong>Gênero:</strong> -<br><strong>Curso:</strong> -<br><strong>Interesses:</strong> -</div>
          </div>


          <pre id="resultado" class="bg-dark text-light rounded p-3 mt-3 small d-none"></pre>

          <div class="text-center mt-3">
            <a href="perfil.html">Já tenho conta</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
