<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Perfil</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body class="d-flex align-items-center py-4">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <div class="card card-form p-4">
          <div class="logo text-white mx-auto mb-3">🔐</div>
          <h1 class="h3 text-center fw-bold">Bem-vindo de volta</h1>
          <p class="text-center text-secondary mb-4">Entre para acessar seu perfil</p>

          <form id="formLogin" novalidate>

          
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="voce@exemplo.com">
              <div class="invalid-feedback d-block" id="erroEmail"></div>
            </div>

          
            <div class="mb-3">
              <label for="senha" class="form-label fw-semibold">Senha</label>
              <div class="input-group">
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha">
                <button type="button" class="btn btn-outline-secondary" id="toggleSenha">Mostrar</button>
              </div>
              <div class="invalid-feedback d-block" id="erroSenha"></div>
            </div>

           
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">
              <label class="form-check-label" for="lembrar">Lembrar de mim</label>
            </div>

            <button type="submit" class="btn btn-principal w-100 py-2 fw-semibold">Entrar</button>
            <p id="msgLogin" class="mt-3"></p>
          </form>

          
          <div class="d-flex justify-content-between mt-2">
            <a href="#" id="linkRecuperar">Esqueci minha senha</a>
            <a href="#" id="linkCadastro">Criar conta</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
